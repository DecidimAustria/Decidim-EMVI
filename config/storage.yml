test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

minio:
  service: S3
  endpoint: <%= ENV.fetch("MINIO_ENDPOINT", "https://cdn.participation.works") %>
  access_key_id: <%= ENV['MINIO_ACCESS_KEY_ID'] %>
  secret_access_key: <%= ENV['MINIO_SECRET_ACCESS_KEY'] %>
  bucket: <%= ENV['MINIO_BUCKET'] %>
  region: <%= ENV.fetch("MINIO_REGION", "eu-central-1") %>
  force_path_style: true # so that the bucket is part of the path and not the subdomain

mirror:
  service: Mirror
  primary: local
  mirrors: [ minio ]

s3:
  service: S3
  access_key_id: <%= ENV["AWS_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["AWS_SECRET_ACCESS_KEY"] %>
  bucket: <%= ENV["AWS_BUCKET"] %>
  <%= "region: #{ENV["AWS_REGION"]}" if ENV["AWS_REGION"] %>
  <%= "endpoint: #{ENV["AWS_ENDPOINT"]}" if ENV["AWS_ENDPOINT"] %>

azure:
  service: AzureStorage
  storage_account_name: <%= ENV["AZURE_STORAGE_ACCOUNT_NAME"] %>
  storage_access_key: <%= ENV["AZURE_STORAGE_ACCESS_KEY"] %>
  container: <%= ENV["AZURE_CONTAINER"] %>

gcs:
  service: GCS
  project: <%= ENV["GCS_PROJECT"] %>
  bucket: <%= ENV["GCS_BUCKET"] %>
  credentials:
    type: <%= ENV.fetch("GCS_TYPE", "service_account") %>
    project_id: <%= ENV["GCS_PROJECT_ID"] %>
    private_key_id: <%= ENV["GCS_PRIVATE_KEY_ID"] %>
    private_key: <%= ENV["GCS_PRIVATE_KEY"] %>
    client_email: <%= ENV["GCS_CLIENT_EMAIL"] %>
    client_id: <%= ENV["GCS_CLIENT_ID"] %>
    auth_uri: <%= ENV.fetch("GCS_AUTH_URI", "https://accounts.google.com/o/oauth2/auth") %>
    token_uri: <%= ENV.fetch("GCS_TOKEN_URI", "https://accounts.google.com/o/oauth2/token") %>
    auth_provider_x509_cert_url: <%= ENV.fetch("GCS_AUTH_PROVIDER_X509_CERT_URL", "https://www.googleapis.com/oauth2/v1/certs") %>
    client_x509_cert_url: <%= ENV["GCS_CLIENT_X509_CERT_URL"] %>

