---
bs:
  decidim:
    debates:
      actions:
        new: Nova rasprava
    admin:
      organization_appearance:
        form:
          colors:
            colors_warning_html: Upozorenje! Promjena ovih boja može prekinuti kontraste pristupačnosti. Kontrast po svom izboru možete provjeriti s <a href="https://webaim.org/resources/contrastchecker">WebAIM Contrast Checkerom</a> ili drugim sličnim alatima.
    components:
      add_comment_form:
        account_message: Prijavite se svojim računom
    meetings:
      close_meeting_reminder_mailer:
        close_meeting_reminder:
          subject: 'Zatvori događanje: %{meeting_title}'
      registration_mailer:
        confirmation:
          confirmed_html: Vaša prijava za događanje <a href="%{url}">%{title}</a> je potvrđena.
    proposals:
      admin:
        proposals_imports:
          create:
            success: Prijedlozi su uspješno uvezeni.
    sortitions:
      sortitions:
        show:
          candidate_proposals_info: Razvrstavanje je provedeno između sljedećih prijedloga (%{taxonomy_labels}), sa sljedećim ID-ovima (podebljani odabrani prijedlozi)
    events:
      debates:
        create_debate_event:
          space_followers:
            email_intro: |-
              Bok,
              Nova debata "%{resource_title}" stvorena je na prostoru za sudjelovanje %{participatory_space_title}, pogledajte je i doprinesite:
            email_outro: Primili ste ovu obavijest jer pratite prostor za sudjelovanje %{participatory_space_title}. Možete prestati primati obavijesti slijedeći prethodnu poveznicu.
            email_subject: Nova debata "%{resource_title}" na %{participatory_space_title}
            notification_title: Rasprava o <a href="%{resource_path}">%{resource_title}</a> stvorena je <a href="%{participatory_space_url}">%{participatory_space_title}</a>.
    budgets:
      admin:
        projects:
          update_selected:
            invalid:
              selected: 'Ovi projekti već su odabrani za provedbu: %{errored}.'
              unselected: 'Ovi projekti već su poništeni iz implementacije: %{errored}.'
            success:
              selected: 'Ovi projekti su uspješno odabrani za implementaciju: %{successful}.'
              unselected: 'Ovi su projekti uspješno poništeni iz implementacije: %{successful}.'
