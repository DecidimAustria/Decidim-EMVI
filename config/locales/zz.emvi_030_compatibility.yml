      imports:
        notice: "%{count} %{resource_name} erfolgreich importiert."
      organization_appearance:
        form:
          colors:
            colors_warning_html: Warnung! Das Ändern dieser Farben kann die für Barrierefreiheit notwendigen Kontraste brechen. Sie können den Kontrast Ihrer Wahl mit <a href="https://webaim.org/resources/contrastchecker">WebAIM Contrast Checker</a> oder ähnlichen Tools überprüfen.
el:
  decidim:
    debates:
      actions:
        new: Create new debate
    admin:
      organization_appearance:
        form:
          colors:
            colors_warning_html: Προειδοποίηση! Η αλλαγή αυτών των χρωμάτων μπορεί να σπάσει τις αντιθέσεις προσβασιμότητας. Μπορείτε να ελέγξετε την αντίθεση της επιλογής σας με το <a href="https://webaim.org/resources/contrastchecker">WebAIM Contrast Checker</a> ή άλλα παρόμοια εργαλεία.
    components:
      add_comment_form:
        account_message: Συνδεθείτε με τον λογαριασμό σας
    meetings:
      close_meeting_reminder_mailer:
        close_meeting_reminder:
          subject: 'Κλείσιμο εκδήλωσης: %{meeting_title}'
    sortitions:
      sortitions:
        show:
          candidate_proposals_info: Η ταξινόμηση πραγματοποιήθηκε μεταξύ των παρακάτω προτάσεων (%{taxonomy_labels}), με τα ακόλουθα αναγνωριστικά (με έντονους χαρακτήρες οι επιλεγμένες προτάσεις)
    events:
      debates:
        create_debate_event:
          space_followers:
            email_intro: |-
              Γεια,
              Δημιουργήθηκε μια νέα συζήτηση "%{resource_title}" σχετικά με τον συμμετοχικό χώρο %{participatory_space_title}, ελέγξτε τον και συνεισφέρετε:
            email_outro: Έχετε λάβει αυτήν την ειδοποίηση επειδή ακολουθείτε τον συμμετοχικό χώρο %{participatory_space_title}. Μπορείτε να σταματήσετε να λαμβάνετε ειδοποιήσεις ακολουθώντας τον προηγούμενο σύνδεσμο.
            email_subject: Νέα συζήτηση "%{resource_title}" στο %{participatory_space_title}
            notification_title: Η συζήτηση <a href="%{resource_path}">%{resource_title}</a> δημιουργήθηκε στις <a href="%{participatory_space_url}">%{participatory_space_title}</a>.
    budgets:
      admin:
        projects:
          update_selected:
            invalid:
              selected: 'Αυτά τα έργα έχουν ήδη επιλεγεί για υλοποίηση: %{errored}.'
              unselected: 'Αυτά τα έργα είχαν ήδη αποεπιλεγεί από την υλοποίηση: %{errored}.'
            success:
              selected: 'Αυτά τα έργα επιλέχθηκαν με επιτυχία για υλοποίηση: %{successful}.'
              unselected: 'Αυτά τα έργα καταργήθηκαν με επιτυχία από την υλοποίηση: %{successful}.'
fa-IR:
  decidim:
    debates:
      actions:
        new: بحث جدید
    admin:
      organization_appearance:
        form:
          colors:
            colors_warning_html: هشدار! تغییر این رنگ ها می تواند تضادهای دسترسی را از بین ببرد. می توانید کنتراست انتخابی خود را با <a href="https://webaim.org/resources/contrastchecker">WebAIM Contrast Checker</a> یا سایر ابزارهای مشابه بررسی کنید.
    components:
      add_comment_form:
        account_message: با حساب خود وارد شوید
    meetings:
      close_meeting_reminder_mailer:
        close_meeting_reminder:
          subject: 'جلسه بسته: %{meeting_title}'
    proposals:
      admin:
        proposals_imports:
          create:
            success: پیشنهادها با موفقیت وارد شدند.
    sortitions:
      sortitions:
        show:
          candidate_proposals_info: مرتب‌سازی بین پیشنهادات زیر انجام شد (%{taxonomy_labels})، با شناسه‌های زیر (پیشنهادهای انتخابی به صورت پررنگ)
    events:
      debates:
        create_debate_event:
          space_followers:
            email_intro: |-
              سلام،
              یک بحث جدید "%{resource_title}" در فضای مشارکتی %{participatory_space_title} ایجاد شده است، آن را بررسی کنید و مشارکت کنید:
            email_outro: شما این اعلان را دریافت کرده اید زیرا فضای مشارکتی %{participatory_space_title} را دنبال می کنید. می توانید از طریق پیوند قبلی دریافت اعلان ها را متوقف کنید.
            email_subject: مناظره جدید "%{resource_title}" در %{participatory_space_title}
            notification_title: بحث <a href="%{resource_path}">%{resource_title}</a> در <a href="%{participatory_space_url}">%{participatory_space_title}</a> ایجاد شد.
    budgets:
      admin:
        projects:
          update_selected:
            invalid:
              selected: 'این پروژه ها قبلاً برای اجرا انتخاب شده بودند: %{errored}.'
              unselected: 'این پروژه‌ها قبلاً از پیاده‌سازی انتخاب نشده بودند: %{errored}.'
            success:
              selected: 'این پروژه ها با موفقیت برای اجرا انتخاب شدند: %{successful}.'
              unselected: 'این پروژه ها با موفقیت از پیاده سازی حذف شدند: %{successful}.'
