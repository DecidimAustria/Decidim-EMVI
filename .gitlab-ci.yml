# BuildKit trial: build images without deploying them to Kubernetes.
include:
  - component: gitlab.webface.at/components/rails-deploy/pipeline@4407075d811337c775f4512d696d50cdcd7aade5
    inputs:
      ruby-version: "3.2.7"
      node-version: "18.17.1"
      eslint-command: npx --no-install eslint --config packages/eslint-config/index.js app/packs config/webpack --format json --output-file tmp/code-quality/eslint.json
      stylelint-command: npx --no-install stylelint --config packages/stylelint-config/index.js "app/**/*.{css,scss}" --formatter json --output-file tmp/code-quality/stylelint.json
      build-feature-branches: true
      deploy: false
